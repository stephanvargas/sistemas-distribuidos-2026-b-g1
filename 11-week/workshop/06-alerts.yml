groups:
  - name: edutrack_attendance_slo_alerts
    rules:
      - alert: AttendanceApiAvailabilityFastBurn
        expr: |
          (
            sum(rate(attendance_records_failed_total{status_code=~"5.."}[1h]))
            /
            sum(rate(attendance_records_total[1h]))
          ) > (14.4 * 0.005)
          and
          (
            sum(rate(attendance_records_failed_total{status_code=~"5.."}[5m]))
            /
            sum(rate(attendance_records_total[5m]))
          ) > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
          team: attendance
          tier: core
        annotations:
          summary: "Fast burn rate on Attendance API availability (burn rate > 14.4x)"
          description: "Critical error rate consumes 2% of the 30-day error budget within 1 hour."
          runbook_url: "https://github.com/stephanvargas/sistemas-distribuidos-2026-b-g1/blob/main/11-week/workshop/07-runbook.md"

      - alert: AttendanceApiAvailabilitySlowBurn
        expr: |
          (
            sum(rate(attendance_records_failed_total{status_code=~"5.."}[6h]))
            /
            sum(rate(attendance_records_total[6h]))
          ) > (6.0 * 0.005)
          and
          (
            sum(rate(attendance_records_failed_total{status_code=~"5.."}[30m]))
            /
            sum(rate(attendance_records_total[30m]))
          ) > (6.0 * 0.005)
        for: 15m
        labels:
          severity: warning
          team: attendance
          tier: core
        annotations:
          summary: "Slow burn rate on Attendance API availability (burn rate > 6x)"
          description: "Sustained errors consume 5% of the 30-day error budget within 6 hours."
          runbook_url: "https://github.com/stephanvargas/sistemas-distribuidos-2026-b-g1/blob/main/11-week/workshop/07-runbook.md"
