name: Identity Security Gates & Authorization Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-credentials-and-secrets:
    name: Secret Detection & Key Leakage Guard (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source tree with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze commits for hardcoded JWT secrets and credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  identity-sast-and-sca:
    name: Dependency Vulnerability Analysis (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch code
        uses: actions/checkout@v4

      - name: Execute Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '1'

  verify-authorization-boundaries:
    name: Automated Negative Authorization Regression Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize JDK 21 Environment
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Identity Negative Authorization Suite
        run: |
          mvn test -Dtest=IdentityAuthorizationNegativeTest
